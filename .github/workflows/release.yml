name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (integer, starts from 0)
        required: true
        default: "0"
        type: number

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" || true

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: WireFinder v${{ inputs.version }}
          body: |
            ## WireFinder v${{ inputs.version }}

            Android app that detects known Wi-Fi networks from an encrypted CSV and alerts you when one is nearby.

            ### Artifacts
            - `app-release.apk` — signed release build
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
