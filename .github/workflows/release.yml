name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (integer, starts from 0)
        required: true
        default: "0"
        type: number

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: WireFinder v${{ inputs.version }}
          body: |
            ## WireFinder v${{ inputs.version }}

            Android app that detects known Wi-Fi networks from an encrypted CSV and alerts you when one is nearby.

            ### Artifacts
            - `app-release.apk` — signed release build
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
